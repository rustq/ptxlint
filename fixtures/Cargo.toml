[package]
name = "ptxlint-fixtures"
version = "0.0.1"
edition = "2024"
publish = false

# Each example compiles to its own .ptx module, so every lint gets an
# isolated fixture instead of sharing one file.
[[example]]
name = "clean_saxpy"
crate-type = ["cdylib"]

[[example]]
name = "ptx001_local_memory"
crate-type = ["cdylib"]

[[example]]
name = "ptx003_fp64_literals"
crate-type = ["cdylib"]

[[example]]
name = "ptx004_integer_division"
crate-type = ["cdylib"]

[[example]]
name = "ptx005_register_pressure"
crate-type = ["cdylib"]

[[example]]
name = "ptx008_narrow_access"
crate-type = ["cdylib"]

[[example]]
name = "ptx009_launch_bounds"
crate-type = ["cdylib"]

[[example]]
name = "ptx010_uninlined_calls"
crate-type = ["cdylib"]

[[example]]
name = "ptx002_register_spills"
crate-type = ["cdylib"]

[[example]]
name = "ptx006_low_occupancy"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
