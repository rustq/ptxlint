name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  # Keeps the rust-version in Cargo.toml honest.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo test --release

  # Dogfooding: this runner has no GPU and no CUDA toolkit, which is exactly
  # the situation ptxlint is built for.
  lint-ptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release

      - name: Report on every case
        run: ./target/release/ptxlint cases

      - name: Each case must trigger the lint it is named after
        shell: bash
        run: |
          set -u
          for ptx in cases/ptx*.ptx; do
            code=$(basename "$ptx" | cut -c1-6 | tr '[:lower:]' '[:upper:]')
            args=(--deny "$code")
            # PTX002 and PTX006 need register counts that only ptxas knows.
            report="${ptx%.ptx}.ptxas.txt"
            [[ -f $report ]] && args+=(--ptxas-report "$report")
            # `shell: bash` runs with -e, and a firing lint exits non-zero on
            # purpose, so the status has to be captured rather than inherited.
            status=0
            ./target/release/ptxlint "${args[@]}" "$ptx" > /dev/null || status=$?
            # 1 means the denied lint fired, which is what this case is for.
            # 0 means it stopped firing; anything else is ptxlint itself failing.
            if [[ $status -ne 1 ]]; then
              echo "::error file=$ptx::expected $code to fire (exit 1), got exit $status"
              exit 1
            fi
            echo "$ptx -> $code"
          done

      - name: Known-good kernels must stay silent
        run: |
          ./target/release/ptxlint --deny all cases/clean_saxpy.ptx
          ./target/release/ptxlint --deny error cases/nanoid_regression.ptx

  # The .ptx fixtures are generated from Rust; make sure that still compiles.
  build-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: nvptx64-nvidia-cuda
          components: llvm-bitcode-linker, llvm-tools
      - run: cargo build --release --examples
        working-directory: fixtures
