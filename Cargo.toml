[package]
name = "ptxlint"
version = "0.0.1"
edition = "2024"
description = "Static analysis and performance lints for NVIDIA PTX, with no GPU or CUDA install required"
license = "MIT"
keywords = ["cuda", "ptx", "gpu", "lint", "nvidia"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/meloalright/ptxlint"
readme = "README.md"
authors = ["meloalright"]
exclude = ["fixtures/target", "/.github"]

[dependencies]

[profile.release]
opt-level = 3
