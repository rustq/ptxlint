[package]
name = "ptxlint"
version = "0.0.3"
edition = "2021"
rust-version = "1.75"
description = "Static analysis and lints for NVIDIA PTX, no GPU needed. 不需要显卡的 NVIDIA PTX 静态分析工具"
license = "MIT"
keywords = ["cuda", "ptx", "gpu", "lint", "nvidia"]
categories = ["development-tools", "command-line-utilities"]
repository = "https://github.com/rustq/ptxlint"
readme = "README.md"
authors = ["meloalright"]
exclude = ["fixtures/target", "/.github"]

[dependencies]

[profile.release]
opt-level = 3
